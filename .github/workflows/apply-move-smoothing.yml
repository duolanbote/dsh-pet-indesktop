name: Apply move smoothing patch

on:
  push:
    branches:
      - chatgpt/move-smoothing
    paths:
      - .github/workflows/apply-move-smoothing.yml
      - tools/apply_move_smoothing_patch.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/move-smoothing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_move_smoothing_patch.py
      - name: Validate syntax
        run: python -m py_compile pet/window.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet/window.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: smooth short move animations"
          git push origin HEAD:chatgpt/move-smoothing
