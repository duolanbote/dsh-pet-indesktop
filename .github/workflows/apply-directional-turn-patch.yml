name: Apply directional turn patch

on:
  push:
    branches:
      - chatgpt/directional-turns
    paths:
      - .github/workflows/apply-directional-turn-patch.yml
      - tools/apply_directional_turn_patch.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/directional-turns
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_directional_turn_patch.py
      - name: Validate syntax
        run: python -m py_compile pet/window.py
      - name: Commit patch and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet/window.py characters/cc_chibi/videos/text_clips.json
          git rm tools/apply_directional_turn_patch.py .github/workflows/apply-directional-turn-patch.yml
          git commit -m "feat: support directional turn animations"
          git push origin HEAD:chatgpt/directional-turns
